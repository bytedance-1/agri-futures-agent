name: weekly-report

# 每周一北京时间 08:30 生成上周复盘报告，08:35 执行规则与系统安全进化检查。
# 两个任务串行执行，进化脚本依赖周报已拉取的最新 closed_trades.json。
on:
  schedule:
    - cron: "30 0 * * 1"   # UTC 周一 00:30 = 北京时间 08:30
  workflow_dispatch: {}     # 支持手动触发测试

permissions:
  contents: write            # 进化脚本可能更新 config.json / state.json

concurrency:
  group: weekly-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 生成周报
        env:
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
        run: python weekly_report.py

  evolve:
    runs-on: ubuntu-latest
    needs: report
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 规则与系统安全进化
        env:
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
        run: python rule_evolution.py

      - name: 把进化结果提交回仓库
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config.json state.json
          if git diff --cached --quiet; then
            echo "无配置变化"
          else
            git commit -m "data: 规则进化更新 [skip ci]"
            git pull --rebase --autostash || true
            git push
          fi
